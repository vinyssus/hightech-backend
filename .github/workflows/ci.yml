name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilation et tests d'intégration
        run: |
          set -o pipefail
          mvn -B test 2>&1 | tee build.log
      - name: Résumé des erreurs (annotations)
        if: failure()
        run: |
          {
            grep -E "\[ERROR\]|Tests run:.*Fail|FAILURE|expected|Expected|but was|Caused by|Exception:" build.log \
              | grep -v "^\s*at " | head -n 80
            for f in target/surefire-reports/*.txt; do [ -f "$f" ] && grep -B2 -A12 -E "FAILURE|ERROR" "$f" | head -n 60; done
          } > summary.txt || true
          msg=$(sed -e 's/%/%25/g' summary.txt | head -c 60000 | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build::${msg}"
      - name: Bilan des tests
        if: always()
        run: |
          msg=$(grep -E "Tests run:" build.log | grep -v "Time elapsed" | tail -n 1)
          per=$(grep -E "Tests run:.*in cm\." build.log | sed -E 's/.*Tests run: ([0-9]+).* in (.*)/\2: \1/' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Tests::${msg}%0A${per}"
