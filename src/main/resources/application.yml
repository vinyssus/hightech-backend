# =====================================================================
#  HITECH DZ - Backend d'authentification
#  Tous les secrets sont lus depuis des variables d'environnement.
#  Variables OBLIGATOIRES : DB_USERNAME, DB_PASSWORD, JWT_SECRET
# =====================================================================
server:
  # Le frontend React tourne sur 8080 en dev : le backend écoute sur 8081 par défaut.
  port: ${PORT:8081}
  # Mettre "native" ou "framework" derrière un reverse proxy (nginx...) pour que
  # le rate limiting voie la vraie IP du client (X-Forwarded-For).
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: hitech-dz-auth
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hitechdz}
    username: ${DB_USERNAME:vinyssus}
    password: ${DB_PASSWORD:x}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # le schéma est géré exclusivement par Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false   # createdAt au format ISO-8601
    time-zone: UTC
  # Utilisé uniquement si MAIL_PROVIDER=smtp
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    # Clé HMAC encodée en Base64, au moins 32 octets (256 bits).
    # Générer avec : openssl rand -base64 48
    secret: ${JWT_SECRET}
    issuer: hitech-dz
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl-remember: ${JWT_REFRESH_TTL_REMEMBER:30d}
    refresh-token-ttl-session: ${JWT_REFRESH_TTL_SESSION:1d}
  cors:
    # Liste séparée par des virgules
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
  password-reset:
    code-ttl: 15m
    max-attempts: 5
  rate-limit:
    login:
      max-requests: ${RATE_LIMIT_LOGIN_MAX:10}
      window: ${RATE_LIMIT_LOGIN_WINDOW:1m}
    forgot-password:
      max-requests: ${RATE_LIMIT_FORGOT_MAX:5}
      window: ${RATE_LIMIT_FORGOT_WINDOW:15m}
  mail:
    provider: ${MAIL_PROVIDER:console}   # console | smtp
    from: ${MAIL_FROM:no-reply@hitech-dz.cm}
  admin:
    # Compte de démonstration créé au démarrage s'il n'existe pas.
    # Désactiver en production : ADMIN_SEED_ENABLED=false
    seed-enabled: ${ADMIN_SEED_ENABLED:true}
    email: ${ADMIN_EMAIL:admin@hitech-dz.cm}
    password: ${ADMIN_PASSWORD:Admin123}

logging:
  level:
    cm.hitechdz: INFO
